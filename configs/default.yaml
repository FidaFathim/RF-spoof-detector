# Single source of truth for one experiment run.
# Log this file (or its resolved copy) alongside every result you report — the project guide
# requires "fixed experiment configuration and saved code version / package versions".

experiment_name: baseline_v1
seed: 0
seeds_for_variation: [0, 1, 2]   # run the full pipeline 3x, report mean +/- spread

data:
  wisig_root: data/raw/wisig          # directory containing e.g. ManySig.pkl
  wisig_subset: ManySig               # ManySig | ManyTx | ManyRx | SingleDay (compact subsets)
  equalized: 1                        # NOTE (see PAPER_NOTES.md "Week 1 findings" #1, #5):
                                       # the baseline CNN gets ~16.7% test accuracy on
                                       # held-out sessions (= random chance for 6 classes)
                                       # with EITHER equalized=0 or equalized=1 -- switching
                                       # this flag alone does not fix cross-session
                                       # generalization, despite an earlier (wrong, since
                                       # corrected) claim that it did. Left at 1 because raw
                                       # is no better and the CNN + physical-feature branches
                                       # must use the SAME domain regardless (see #4) -- but
                                       # generalization itself is still an open problem to
                                       # solve in week 1-2, not something this flag resolves.
  splits_dir: data/splits
  sample_rate_hz: 20_000_000          # ASSUMED 20 MSps (standard 802.11 capture rate) — confirm
                                       # against the WiSig paper before trusting CFO/phase-noise Hz values
  iq_length: 256                      # confirmed: WiSig "Id Signals" are 256-sample preambles

baseline_cnn:
  in_channels: 2          # I and Q as separate channels
  num_classes: null       # set at runtime from the loaded label set
  conv_channels: [64, 128, 256]
  kernel_size: 7
  dropout: 0.3
  lr: 1.0e-3
  batch_size: 128
  epochs: 30
  weight_decay: 1.0e-4

features:
  cfo:
    preamble_len: 160          # 802.11a/g/n L-STF: 10 repetitions x 16 samples
    repeat_len: 16
    num_repeats: 10
  iq_imbalance:
    window: preamble           # "preamble" or "full" — which segment to estimate over
  phase_noise:
    # phase-noise proxy = std of residual phase (after CFO removal) across repeated segments
    detrend: true

attacks:
  fgsm:
    epsilon: 0.02
  pgd:
    epsilon: 0.02
    alpha: 0.004
    steps: 20
  uap:
    epsilon: 0.02
    max_iters: 200
  gan_impersonation:
    enabled: false   # flip on once the adapted Karunaratne et al. generator is wired up
  hwe:
    enabled: false   # stretch goal, week 4 only if ahead of schedule

consistency_gate:
  method: gaussian        # "gaussian" | "one_class_svm" | "isolation_forest"
  mode: per_device        # "per_device" | "global" — keep both as an ablation, not a final choice
  use_session_relative: true   # CONFIRMED helpful empirically (see PAPER_NOTES.md): raw CFO
                                # mixes in the receiver's own LO offset and drifts across
                                # capture days, so a per-device gate trained on some sessions
                                # false-rejects legitimate signals from held-out sessions of
                                # the SAME device. Subtracting each session's own median
                                # (src/features/session_normalize.py) fixes most of this.
  feature_set: [cfo_hz, iq_amp_imbalance_db, iq_phase_imbalance_rad, phase_noise_rad]
  one_class_svm:
    nu: 0.05
    kernel: rbf
    gamma: scale
  isolation_forest:
    n_estimators: 200
    contamination: 0.05

fusion:
  rule: and             # CNN-claims-device AND gate-passes
  # threshold selected on validation split only — see src/consistency/calibrate.py
  target_val_false_positive_rate: 0.05

ablations:
  - cnn_confidence_only
  - single_feature_gate   # repeated once per feature in feature_set
  - features_as_classifier_input
  - separate_consistency_gate   # the actual proposal
